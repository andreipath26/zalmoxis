name: Bridge SDK checks
on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [auth-server, mcp-server]
    defaults:
      run:
        working-directory: bridge/${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install upstream dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Phone API security tests
        if: matrix.workspace == 'mcp-server'
        run: npm test
      - name: Bundle Worker without deploying
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const name=process.env.MCP_WORKSPACE || "bridge"; const flags=name==="auth-server"?["nodejs_compat","global_fetch_strictly_public"]:["nodejs_compat"]; fs.writeFileSync("wrangler.ci.jsonc",JSON.stringify({name:"zalmoxis-ci-"+name,main:"src/index.ts",compatibility_date:"2026-11-23",compatibility_flags:flags},null,2));'
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir /tmp/zalmoxis-bridge-check
        env:
          MCP_WORKSPACE: ${{ matrix.workspace }}
