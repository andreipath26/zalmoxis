name: Android build

on:
  push:
    branches:
      - main
      - codex/gallery-android-foundation
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed_update_ready: ${{ steps.signing.outputs.ready }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies and build state
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Provision verified native offline ASR AAR
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --output app/libs/sherpa-onnx-2.0.3.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar
          echo '4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50  app/libs/sherpa-onnx-2.0.3.aar' | sha256sum --check

      - name: Assemble
        run: ./gradlew :app:assembleDebug --console=plain --build-cache --info

      - name: Android unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zalmoxis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Signed Android updates are published separately. Actions artifacts are ZIP
      # archives, may expire, and must not be installed in place of signed APKs.
      - name: Prepare persistent signing key
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ZALMOXIS_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ZALMOXIS_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ZALMOXIS_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ZALMOXIS_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "Signed updates are disabled: configure the four ZALMOXIS_SIGNING_* repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zalmoxis-update-keystore.jks"
          {
            echo "ready=true"
            echo "keystore=$RUNNER_TEMP/zalmoxis-update-keystore.jks"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble persistently signed Android update APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ZALMOXIS_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ZALMOXIS_KEYSTORE_PASSWORD: ${{ secrets.ZALMOXIS_SIGNING_STORE_PASSWORD }}
          ZALMOXIS_KEY_ALIAS: ${{ secrets.ZALMOXIS_SIGNING_KEY_ALIAS }}
          ZALMOXIS_KEY_PASSWORD: ${{ secrets.ZALMOXIS_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain --build-cache

      - name: Verify and upload persistently signed APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "$RUNNER_TEMP/zalmoxis-update.apk"

      - name: Upload signed update for release job
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zalmoxis-signed-update
          path: ${{ runner.temp }}/zalmoxis-update.apk
          if-no-files-found: error
          retention-days: 2

  publish_update:
    name: Publish signed Android update
    needs: assemble
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.assemble.outputs.signed_update_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK from build job
        uses: actions/download-artifact@v4
        with:
          name: zalmoxis-signed-update
          path: signed-update

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="signed-update/zalmoxis-update.apk"
          test -s "$apk"
          sha256sum "$apk"
          tag="android-build-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Zalmoxis Android build $GITHUB_RUN_NUMBER" \
              --notes "Signed Android update from successful main build. Installation requires explicit Android user approval and matching signing identity." \
              --prerelease
          fi
